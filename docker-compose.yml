version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend - FastAPI
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: problemfinder-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DIMENSION=384
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - problemfinder-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend - Next.js
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: problemfinder-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - problemfinder-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Scrapers - Data Collection
  # ─────────────────────────────────────────────────────────────────────────────
  scrapers:
    build:
      context: ./scrapers
      dockerfile: Dockerfile
    container_name: problemfinder-scrapers
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./scrapers:/app
      - ./data:/app/data
    # Por defecto no se ejecuta; usa: docker-compose run scrapers python main.py
    command: tail -f /dev/null
    restart: "no"
    networks:
      - problemfinder-network

networks:
  problemfinder-network:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Volúmenes
# ─────────────────────────────────────────────────────────────────────────────
